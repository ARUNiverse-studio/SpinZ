<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="upload-section">
      <h2>Upload Images</h2>
      <input type="file" id="imageUpload" multiple accept="image/*, .heic">
      <button id="generateButton">Generate 360° View</button>
      <button id="startAgainButton" style="display: none;">Clear</button>
      <button id="exportButton" style="display: none;">Export</button>
      <button id="copyEmbedButton" style="display: none;">Copy Embed Code</button>
    </div>
    <div id="viewerContainer">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
